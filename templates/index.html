<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
    <h1>Welcome</h1>
    {% if is_logged_in %}
    <h2>welcome back</h2>
    {% else %}
    <h2>please login!</h2>
    {% endif %}

    {% if marks >= 90 %}
    <h2>Grade A</h2>
    {% elif marks >=75 %}
    <h2>Grade B</h2>
    {% elif marks >=50 %}
    <h2>Grade C</h2>
    {% else %}
    <h2>Fail!</h2>
    {% endif %}
</body>
    
</html>
